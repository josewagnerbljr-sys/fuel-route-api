<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="google" content="notranslate">
  <title>Route and fuel stops</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; }
    #layout { display: flex; height: 100%; }
    #panel { width: 340px; overflow-y: auto; padding: 16px; box-sizing: border-box; border-right: 1px solid #ddd; }
    #map { flex: 1; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    td, th { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid #eee; vertical-align: top; }
    .total { font-weight: 600; }
    @media (max-width: 700px) {
      #layout { flex-direction: column-reverse; }
      #panel { width: auto; max-height: 40%; border-right: 0; border-top: 1px solid #ddd; }
    }
  </style>
</head>
<body>
<div id="layout">
  <div id="panel">
    <h1 id="title"></h1>
    <div id="route"></div>
    <div id="cost" class="total"></div>
    <div id="savings"></div>
    <table>
      <thead><tr><th>#</th><th>Station</th><th>Mile</th><th>Gal</th><th>$/gal</th></tr></thead>
      <tbody id="stops"></tbody>
    </table>
  </div>
  <div id="map"></div>
</div>
{{ plan|json_script:"plan-data" }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
{% include "routing/_plan_view.html" %}
<script>
  var plan = JSON.parse(document.getElementById("plan-data").textContent);
  PlanView.init("map");
  PlanView.render(plan, {
    title: document.getElementById("title"),
    route: document.getElementById("route"),
    cost: document.getElementById("cost"),
    savings: document.getElementById("savings"),
    tbody: document.getElementById("stops")
  });
</script>
</body>
</html>
