<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="google" content="notranslate">
  <title>Fuel route planner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #111; }
    #layout { display: flex; height: 100%; }
    #panel { width: 360px; overflow-y: auto; padding: 16px; box-sizing: border-box; border-right: 1px solid #ddd; }
    #map { flex: 1; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
    .buttons { display: flex; gap: 8px; margin-top: 12px; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #1d4ed8; cursor: pointer; }
    button.primary { background: #1d4ed8; color: #fff; }
    button.secondary { background: #fff; color: #1d4ed8; }
    button:disabled { opacity: .6; cursor: default; }
    #status { min-height: 20px; margin-top: 10px; color: #444; }
    #status.error { color: #b91c1c; }
    #results { margin-top: 12px; padding: 8px; border: 1px dashed #bbb; border-radius: 6px; min-height: 60px; }
    #results h2 { font-size: 15px; margin: 0 0 4px; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    td, th { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid #eee; vertical-align: top; }
    .total { font-weight: 600; }
    .hint { color: #666; font-size: 12px; margin-top: 12px; }
    code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; }

    #tour-blocker { position: fixed; inset: 0; z-index: 2000; display: none; }
    #tour-spot { display: none; position: fixed; z-index: 2001; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); pointer-events: none; transition: all .2s ease; }
    #tour-card { position: fixed; z-index: 2002; width: 300px; max-width: calc(100vw - 24px); background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.35); display: none; }
    #tour-card h3 { margin: 0 0 6px; font-size: 15px; }
    #tour-card p { margin: 0 0 12px; }
    #tour-card .step { color: #666; font-size: 12px; }
    #tour-card .nav { display: flex; gap: 8px; align-items: center; }
    #tour-card .nav .spacer { flex: 1; }
    #tour-card button.link { border: 0; background: none; color: #555; padding: 8px 4px; }

    @media (max-width: 700px) {
      #layout { flex-direction: column; }
      #panel { width: auto; max-height: 55%; border-right: 0; border-bottom: 1px solid #ddd; }
    }
  </style>
</head>
<body>
<div id="layout">
  <div id="panel">
    <h1>Fuel route planner</h1>
    <form id="route-form" autocomplete="off">
      <label for="start">Start</label>
      <input type="text" id="start" name="start" value="Chicago, IL" placeholder="City, ST, ZIP or lat,lon">
      <label for="finish">Finish</label>
      <input type="text" id="finish" name="finish" value="Dallas, TX" placeholder="City, ST, ZIP or lat,lon">
      <div class="buttons">
        <button type="submit" id="plan" class="primary">Plan route</button>
        <button type="button" id="tour-btn" class="secondary">Tutorial</button>
      </div>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="results">
      <h2 id="title">Results appear here</h2>
      <div id="route"></div>
      <div id="cost" class="total"></div>
      <div id="savings"></div>
      <table>
        <thead><tr><th>#</th><th>Station</th><th>Mile</th><th>Gal</th><th>$/gal</th></tr></thead>
        <tbody id="stops"></tbody>
      </table>
    </div>
    <div class="hint">API: <code>POST /api/route/</code> with <code>{"start": "...", "finish": "..."}</code></div>
  </div>
  <div id="map"></div>
</div>

<div id="tour-blocker"></div>
<div id="tour-spot"></div>
<div id="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" tabindex="-1">
  <div class="step" id="tour-step"></div>
  <h3 id="tour-title"></h3>
  <p id="tour-text"></p>
  <div class="nav">
    <button type="button" class="link" id="tour-skip">Skip</button>
    <span class="spacer"></span>
    <button type="button" class="secondary" id="tour-back">Back</button>
    <button type="button" class="primary" id="tour-next">Next</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
{% include "routing/_plan_view.html" %}
<script>
  var els = {
    title: document.getElementById("title"),
    route: document.getElementById("route"),
    cost: document.getElementById("cost"),
    savings: document.getElementById("savings"),
    tbody: document.getElementById("stops")
  };
  var statusEl = document.getElementById("status");
  var planButton = document.getElementById("plan");
  PlanView.init("map");

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  function planRoute() {
    var start = document.getElementById("start").value.trim();
    var finish = document.getElementById("finish").value.trim();
    if (!start || !finish) { setStatus("Enter a start and a finish location.", true); return; }
    setStatus("Planning route...", false);
    planButton.disabled = true;
    fetch("{% url 'route' %}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ start: start, finish: finish })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          setStatus(res.data.error ? res.data.error.message : "Request failed.", true);
          return;
        }
        PlanView.render(res.data, els);
        setStatus("Done in " + res.data.meta.elapsed_ms + " ms, " + res.data.meta.external_calls + " external call(s).", false);
      })
      .catch(function () { setStatus("Could not reach the server.", true); })
      .then(function () { planButton.disabled = false; });
  }

  document.getElementById("route-form").addEventListener("submit", function (e) {
    e.preventDefault();
    planRoute();
  });

  // First-use tutorial
  var steps = [
    { target: "start", title: "1. Start location", text: "Click here and type where the trip begins: City, ST (for example Chicago, IL), a ZIP code, or latitude and longitude." },
    { target: "finish", title: "2. Finish location", text: "Click here and type where the trip ends, in the same format." },
    { target: "plan", title: "3. Plan the route", text: "Click this button, or press Enter, to get the route and the cheapest fuel stops." },
    { target: "results", title: "4. Read the results", text: "The stops, gallons, prices and total fuel cost appear here. The map shows the route and numbered stops." }
  ];
  var KEY = "fuelroute-tour-done";
  var index = 0;
  var blocker = document.getElementById("tour-blocker");
  var spot = document.getElementById("tour-spot");
  var card = document.getElementById("tour-card");
  var active = false;

  function remember() { try { localStorage.setItem(KEY, "1"); } catch (e) {} }
  function seen() { try { return localStorage.getItem(KEY) === "1"; } catch (e) { return false; } }

  function place() {
    if (!active) { return; }
    var step = steps[index];
    var target = document.getElementById(step.target);
    target.scrollIntoView({ block: "nearest" });
    var r = target.getBoundingClientRect();
    var pad = 6;
    spot.style.left = (r.left - pad) + "px";
    spot.style.top = (r.top - pad) + "px";
    spot.style.width = (r.width + 2 * pad) + "px";
    spot.style.height = (r.height + 2 * pad) + "px";
    document.getElementById("tour-step").textContent = "Step " + (index + 1) + " of " + steps.length;
    document.getElementById("tour-title").textContent = step.title;
    document.getElementById("tour-text").textContent = step.text;
    document.getElementById("tour-back").style.visibility = index === 0 ? "hidden" : "visible";
    document.getElementById("tour-next").textContent = index === steps.length - 1 ? "Done" : "Next";
    var cardHeight = card.offsetHeight;
    var cardWidth = card.offsetWidth;
    var below = r.bottom + 14;
    var top = (below + cardHeight < window.innerHeight) ? below : Math.max(12, r.top - cardHeight - 14);
    var left = Math.min(Math.max(12, r.left), window.innerWidth - cardWidth - 12);
    card.style.top = top + "px";
    card.style.left = left + "px";
  }

  function openTour() {
    active = true;
    index = 0;
    blocker.style.display = "block";
    spot.style.display = "block";
    card.style.display = "block";
    place();
    document.getElementById("tour-next").focus();
  }

  function closeTour() {
    active = false;
    blocker.style.display = "none";
    spot.style.display = "none";
    card.style.display = "none";
    remember();
    document.getElementById("start").focus();
  }

  function go(delta) {
    var next = index + delta;
    if (next < 0) { return; }
    if (next >= steps.length) { closeTour(); return; }
    index = next;
    place();
  }

  document.getElementById("tour-next").addEventListener("click", function () { go(1); });
  document.getElementById("tour-back").addEventListener("click", function () { go(-1); });
  document.getElementById("tour-skip").addEventListener("click", closeTour);
  document.getElementById("tour-btn").addEventListener("click", openTour);
  window.addEventListener("resize", place);
  document.addEventListener("keydown", function (e) {
    if (!active) { return; }
    if (e.key === "Escape") { closeTour(); }
    else if (e.key === "ArrowRight") { go(1); }
    else if (e.key === "ArrowLeft") { go(-1); }
  });

  var params = new URLSearchParams(window.location.search);
  if (params.get("start") && params.get("finish")) {
    document.getElementById("start").value = params.get("start");
    document.getElementById("finish").value = params.get("finish");
    planRoute();
  } else if (!seen()) {
    openTour();
  }
</script>
</body>
</html>
